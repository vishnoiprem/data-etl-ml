version: "3.9"

# apex-rag-omni infra
# 10-shard Qdrant cluster + Elasticsearch + Postgres + Kafka + Flink + Redis

services:
  qdrant-0:
    image: qdrant/qdrant:v1.12.0
    ports: ["6333:6333"]
    volumes: ["qdrant-0:/qdrant/storage"]
  qdrant-1:
    image: qdrant/qdrant:v1.12.0
    ports: ["6334:6333"]
    volumes: ["qdrant-1:/qdrant/storage"]
  qdrant-2:
    image: qdrant/qdrant:v1.12.0
    ports: ["6335:6333"]
    volumes: ["qdrant-2:/qdrant/storage"]
  qdrant-3:
    image: qdrant/qdrant:v1.12.0
    ports: ["6336:6333"]
    volumes: ["qdrant-3:/qdrant/storage"]
  qdrant-4:
    image: qdrant/qdrant:v1.12.0
    ports: ["6337:6333"]
    volumes: ["qdrant-4:/qdrant/storage"]
  qdrant-5:
    image: qdrant/qdrant:v1.12.0
    ports: ["6338:6333"]
    volumes: ["qdrant-5:/qdrant/storage"]
  qdrant-6:
    image: qdrant/qdrant:v1.12.0
    ports: ["6339:6333"]
    volumes: ["qdrant-6:/qdrant/storage"]
  qdrant-7:
    image: qdrant/qdrant:v1.12.0
    ports: ["6340:6333"]
    volumes: ["qdrant-7:/qdrant/storage"]
  qdrant-8:
    image: qdrant/qdrant:v1.12.0
    ports: ["6341:6333"]
    volumes: ["qdrant-8:/qdrant/storage"]
  qdrant-9:
    image: qdrant/qdrant:v1.12.0
    ports: ["6342:6333"]
    volumes: ["qdrant-9:/qdrant/storage"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports: ["9200:9200"]
    volumes: ["es:/usr/share/elasticsearch/data"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on: [zookeeper]
    ports: ["9092:9092"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]

  flink:
    image: flink:1.19
    command: jobmanager
    ports: ["8081:8081"]
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  qdrant-0: {}
  qdrant-1: {}
  qdrant-2: {}
  qdrant-3: {}
  qdrant-4: {}
  qdrant-5: {}
  qdrant-6: {}
  qdrant-7: {}
  qdrant-8: {}
  qdrant-9: {}
  es: {}
  pg: {}
