[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-finetune-genai"
version = "0.1.0"
description = "End-to-end MLOps fine-tuning pipeline: QLoRA + MLflow + vLLM + Prometheus/Grafana."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
readme = "README.md"

# We deliberately do NOT declare [project.dependencies] here; install via
# `pip install -r requirements.txt` so the pinned pairs above stay together.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: tests that require a CUDA GPU and real model weights",
    "live: tests that hit a running vLLM/MLflow/Prometheus (skipped in CI by default)"
]
filterwarnings = [
    "ignore::DeprecationWarning:transformers.*",
    "ignore::FutureWarning:trl.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]   # E501 line-too-long is noisy, B008 is FastAPI default-arg-in-call
