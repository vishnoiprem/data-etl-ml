[project]
name = "multi-agent-trading-pipeline"
version = "0.1.0"
description = "Week 3 capstone — a five-pole multi-agent equity research pipeline."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"