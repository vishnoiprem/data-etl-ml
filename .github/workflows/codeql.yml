name: codeql

# Static-analysis pass on the projects/leads-pipeline/draft-cron Python
# code. Complements grype (which only scans runtime deps) by
# looking at the source itself — SQL injection, unsafe
# deserialisation, weak crypto, etc.
#
# Scoped narrowly to projects/leads-pipeline/draft-cron to keep run
# time <2 min on PRs (a full CodeQL pass over the whole monorepo
# would be 8-15 min and noisy; the rest of the repo is
# tutorials + reference impls where false positives are
# distractors).

on:
  push:
    # `master` is this repo's default branch; `main` is kept for
    # compatibility but is stale. Triggering on `main` alone meant
    # CodeQL never scanned PRs or pushes to the branch that actually
    # receives the work.
    branches: [master, main]
    paths:
      - "projects/leads-pipeline/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "projects/leads-pipeline/**"
  schedule:
    # Mondays 06:30 UTC, ~30 min after pip-audit's Monday
    # 06:00 UTC cron so a single weekly-change burst doesn't
    # collide with other scan jobs.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF

jobs:
  analyze:
    name: Analyze leads-pipeline (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Source root scoped to projects/leads-pipeline/draft-cron —
          # this is the only project with "production-shaped"
          # Python; the rest of the monorepo is tutorials.
          sources: projects/leads-pipeline/draft-cron
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: leads-pipeline-codeql
          # Fail the build only on findings that have a clear
          # security impact. SARIF still includes everything
          # security-extended surfaces, so this just gates
          # the red X in the PR.
          severity: warning
          # analyze@v3 auto-uploads SARIF (default `upload: always`).
          # A second manual upload step is unnecessary and the
          # hard-coded `codeql-database/results.sarif` path doesn't
          # match where analyze writes to (`../results` relative to
          # its working dir). The whole upload step has been removed;
          # analyze handles the SARIF upload itself.
