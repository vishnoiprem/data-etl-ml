name: leads-ci

# CI for leads-pipeline/draft-cron
# - Runs the 6 in-repo test modules against a Postgres service
#   container on a fresh Ubuntu runner
# - Lints the modified source files
# - Triggers on push to main + active feature branches, and on PR
#   to main

on:
  push:
    branches: [main, feature/agent-coding-11oct, feature/auto-pilot-ai-leads-loop]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes on
# force-pushes. For pushes we cancel; for PRs we also cancel so a
# reviewer re-triggering doesn't double-bill.
concurrency:
  group: leads-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: avilx
          POSTGRES_PASSWORD: avilx
          POSTGRES_DB: avilx_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U avilx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: leads-pipeline/draft-cron/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leads-pipeline/draft-cron/requirements.txt
          pip install flake8 pytest

      - name: Init test schema
        env:
          AVILX_DB_HOST: localhost
          AVILX_DB_PORT: 5433
          AVILX_DB_NAME: avilx_test
          AVILX_DB_USER: avilx
          AVILX_DB_PASSWORD: avilx
          PGPASSWORD: avilx
        run: |
          psql -h localhost -p 5433 -U avilx -d avilx_test -f leads-pipeline/draft-cron/db/schema.sql

      - name: Run tests
        env:
          AVILX_DB_HOST: localhost
          AVILX_DB_PORT: 5433
          AVILX_DB_NAME: avilx_test
          AVILX_DB_USER: avilx
          AVILX_DB_PASSWORD: avilx
        run: |
          cd leads-pipeline/draft-cron
          set -e
          for t in test_dedup_key test_dedup test_parser test_resume_tailor test_better_email test_bounce_deny_persistence; do
            echo "===> $t"
            PYTHONPATH=. python -m tests.$t
          done

      - name: Lint (advisory)
        continue-on-error: true
        run: |
          cd leads-pipeline/draft-cron
          # Advisory only — flake8 reports style issues but does not
          # fail the build. Promote to a hard failure once the
          # existing F401/E741/W292 warnings are fixed in a follow-up
          # commit. Allow E501 (we set 110), W503 (old style), E731.
          flake8 --max-line-length 110 --extend-ignore E501,W503,E731 \
            find_more_leads.py find_clients.py refine_pipeline.py \
            backfill_emails.py cover_letter.py dashboard.py \
            bin/loop_status.py bin/loop_bounce_sync.py \
            state/bounce_deny_store.py \
            resume_tailor.py \
            || echo "::warning::Lint advisories above — see https://github.com/vishnoiprem/data-etl-ml/issues"

  # Mirror the CD build so a broken Dockerfile can't reach main.
  # This is the cheapest way to make sure leads-cd will succeed.
  dockerfile-build:
    name: Build Dockerfile (CD guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          if [[ -f leads-pipeline/draft-cron/VERSION ]]; then
            V=$(tr -d '[:space:]' < leads-pipeline/draft-cron/VERSION)
          else
            V="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${V}"

      # Build the image with plain `docker build` (no buildx).
      # This is the most reliable way to put the image into
      # the host docker daemon on a hosted runner. We tried
      # four buildx-based patterns before landing here and
      # each had a different GHA-specific failure mode:
      #
      #   1. `docker/build-push-action@v7` with no `load: true`
      #      → image stuck in buildx cache, `docker run` exited
      #        125 (no such image in the host daemon).
      #   2. `docker/build-push-action@v7` with `load: true` →
      #        same: image not in host daemon after the step.
      #   3. `setup-buildx-action` with `driver: docker` + cache
      #        → BuildKit rejected cache-to with "Cache export
      #        is not supported for the docker driver" (only
      #        `docker-container` driver supports cache exports).
      #   4. `docker buildx build --driver docker --load`
      #        directly → exit 125 from buildx on the GHA
      #        runner (the version of buildx on the runner
      #        doesn't accept the `docker` driver name).
      #
      # Plain `docker build` bypasses all of that: it runs
      # BuildKit directly on the host daemon, the resulting
      # image is visible to `docker images` / `docker run` the
      # moment the command returns, and it works on every
      # GHA runner image without driver juggling.
      #
      # Trade-off: no `cache-from: type=gha` (only buildx
      # supports GHA cache as a backend), so every build is
      # cold — ~30s. The leads-cd workflow is unaffected
      # (it still uses buildx + cache-to gha).
      - name: Build (no push)
        run: |
          set -euo pipefail
          docker build \
            --tag "leads-pipeline:ci-${GITHUB_SHA}" \
            --build-arg "VERSION=${VERSION}" \
            --file leads-pipeline/draft-cron/Dockerfile \
            leads-pipeline/draft-cron
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Smoke test the built image
        env:
          IMAGE_TAG: leads-pipeline:ci-${{ github.sha }}
        run: |
          # Use the in-image healthcheck script — exercises the
          # same import path that production healthchecks will use.
          set -e
          echo "Image to test: $IMAGE_TAG"
          # Sanity check: the previous build step used plain
          # `docker build` (no buildx), so the image must be in
          # `docker images` already. If it isn't, something has
          # gone wrong and the subsequent `docker run` will
          # fail with exit 125.
          docker images | grep -F "$IMAGE_TAG" || {
            echo "::error::image $IMAGE_TAG not in local daemon"
            docker images
            exit 1
          }
          docker run --rm --entrypoint /bin/sh \
            "$IMAGE_TAG" \
            /usr/local/bin/docker-healthcheck.sh
          echo "smoke test exit=$?"

      - name: Image size budget
        env:
          MAX_MB: 300
          IMAGE_TAG: leads-pipeline:ci-${{ github.sha }}
        run: |
          # Read the size in bytes from the docker daemon and fail
          # the build if the image is larger than MAX_MB megabytes.
          # Current measured size: ~164 MB. Budget 300 MB so future
          # deps additions have ~2x headroom before failing CI.
          SIZE_BYTES=$(docker image inspect "$IMAGE_TAG" \
            --format='{{.Size}}')
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))
          echo "image size: ${SIZE_MB} MB (budget: ${MAX_MB} MB)"
          if [ "${SIZE_MB}" -gt "${MAX_MB}" ]; then
            echo "::error::image is ${SIZE_MB} MB which exceeds the ${MAX_MB} MB budget."
            echo "::error::Likely cause: a large file was added to the build context."
            echo "::error::Check leads-pipeline/draft-cron/.dockerignore first."
            exit 1
          fi
          echo "✅ size budget OK"

  # Vulnerability scan: build the same image dockerfile-build just
  # produced, then run grype against it. Fails on any
  # Critical/High finding in the runtime deps so a freshly-introduced
  # CVE can't reach main. Skips Low/Medium/Unknown/Negligible —
  # those are advisory-only.
  #
  # Grype updates its vulnerability database on every run, so a
  # newly-disclosed CVE will fail this job within ~24h of
  # disclosure even if no code changed.
  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: dockerfile-build
    # Skip if the build failed or was cancelled — nothing to scan.
    if: needs.dockerfile-build.result == 'success'
    permissions:
      contents: read
      # security-events: write is needed to upload the SARIF.
      security-events: write
    steps:
      - uses: actions/checkout@v5

      # Re-build locally so this job doesn't need to share the
      # docker daemon with dockerfile-build. ~5s with GHA cache.
      # Uses plain `docker build` for the same reason as the
      # CD-guard job: buildx is fragile on hosted runners,
      # plain `docker build` puts the image directly into the
      # host daemon, and grype (which inspects images from the
      # daemon) gets the right view.
      - name: Read version
        id: version
        run: |
          if [[ -f leads-pipeline/draft-cron/VERSION ]]; then
            V=$(tr -d '[:space:]' < leads-pipeline/draft-cron/VERSION)
          else
            V="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Build (no push) for vuln scan
        run: |
          set -euo pipefail
          docker build \
            --tag "leads-pipeline:scan-${GITHUB_SHA}" \
            --build-arg "VERSION=${VERSION}" \
            --file leads-pipeline/draft-cron/Dockerfile \
            leads-pipeline/draft-cron
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Run grype
        uses: anchore/scan-action@v6
        with:
          image: leads-pipeline:scan-${{ github.sha }}
          severity-cutoff: high
          # Fail the build only on Critical/High; Medium/Low are
          # advisory (uploaded to the Security tab but don't break
          # PRs).
          fail-build: true
          output-format: sarif
          output-file: grype.sarif

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype.sarif
          category: leads-pipeline-grype
