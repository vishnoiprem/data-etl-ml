name: release-please

# Automated release PRs from conventional commits.
#
# On every push to main, release-please scans the commit log since
# the last release, infers the next semver from the conventional
# commit types (feat → minor, fix → patch, feat! / BREAKING CHANGE
# → major), and opens a PR like:
#
#   chore(release): release 1.2.3
#
# Merging that PR creates a GitHub release and a version tag.
# The release trigger then fires leads-cd a second time so the
# image is republished with a semver tag (e.g. `1.2.3`,
# `1.2`, `1`) in addition to `latest`.
#
# Config: release-please-config.json
# Manifest: .release-please-manifest.json (kept in sync by
# release-please on every release).

on:
  push:
    branches: [main]

permissions:
  contents: write        # create release commits + tags
  pull-requests: write   # open the release PR
  issues: write          # comment on linked issues

concurrency:
  # Don't kill an in-flight release commit because a new push to
  # main arrived mid-release; let it finish.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Token needs `contents: write` + `pull-requests: write`
          # for the action to push the release branch + open the PR.
          token: ${{ secrets.GITHUB_TOKEN }}
          # The action's default release strategy is fine: it
          # creates one release PR at a time and updates it on
          # subsequent pushes.

      - name: Trigger leads-cd for semver tag
        if: steps.release.outputs.release_created == 'true'
        # When release-please merges a release PR, this workflow
        # re-fires. The `release` step on that second run sees no
        # new commits and outputs `release_created=false`, so this
        # job no-ops. We only want a fresh leads-cd run when a
        # NEW release was actually created.
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = '${{ steps.release.outputs.tag_name }}';
            if (!tag) {
              core.info('no tag from release step, skipping');
              return;
            }
            core.info(`dispatching leads-cd for tag ${tag}`);
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'leads-cd.yml',
              ref: 'main',
              inputs: { tag_suffix: `v${tag}` }
            });