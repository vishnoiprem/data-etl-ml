name: pr-title-lint

# Enforce Conventional Commits on every PR title. This matters
# because release-please reads PR titles to determine semver
# bumps (feat → minor, fix → patch, feat! → major, chore →
# no-op). A PR titled "Fix bug" won't trigger a release; one
# titled "fix(leads): handle empty inbox" will.
#
# See: https://www.conventionalcommits.org/

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read   # required to comment on PRs

jobs:
  lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commits types used in this repo.
          # Keep in sync with release-please-config.json →
          # `squash.preset` if you ever add a new type there.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          # Optional scope: lowercase, parens allowed. We
          # don't enforce a fixed list — release-please is
          # already aware of `leads` via the config, but
          # freeform scopes (e.g. `ci`, `deps`, `docs`) are
          # fine too.
          requireScope: false
          # Dependabot generates titles with TWO scope groups, e.g.
          #   chore(leads)(deps): update requests requirement ...
          #   chore(ts)(deps-dev): bump typescript from 5.9.3 to 7.0.2 ...
          # The default Conventional Commits parser only accepts a single
          # scope group, so every one of those Dependabot PRs failed this
          # check. We parse the title ourselves and allow an optional
          # second scope group, folding it into the scope.
          #
          # Groups: 1=type, 2=primary scope, 3=secondary scope, 4=subject
          # The scope groups must be non-empty when present: `feat(): x` is
          # rejected, `feat: x` and `feat(ui): x` are accepted.
          headerPattern: '^(\w+)(?:\(([^()]+)\))?(?:\(([^()]+)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, scope2, subject
          # Subject must be at least 3 chars; nothing past 100 chars.
          #
          # The previous limit was 72, which is a soft industry convention for
          # hand-written titles — but Dependabot generates titles mechanically
          # and cannot shorten them. Its subjects run 77-90 characters
          # (e.g. "update python-dotenv requirement from >=1.0.0 to >=1.2.4 in
          # /leads-pipeline/draft-cron"), so a 72-char cap rejected every
          # Dependabot PR that also used a directory scope. 100 accommodates
          # them while still rejecting runaway titles.
          subjectPattern: ^(?!\s*$).{3,100}$
          subjectPatternError: |
            The subject must be 3-100 characters long and not
            blank. Try: `fix(leads): handle empty inbox`.
          # Multi-line commit body: optional, but if present
          # must have a blank line between subject and body.
          # We don't lint the body further — release-please
          # only reads the title.
