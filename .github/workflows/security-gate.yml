name: security-gate

# Hard security gate — fails the build on any HIGH or CRITICAL vuln
# introduced by a manifest change. Runs on PRs touching pip/npm manifests,
# Dockerfiles, or the gate itself. Companion to the advisory `pip-audit`
# workflow which still runs weekly + on every push.

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - "**/requirements*.txt"
      - "**/package.json"
      - "Dockerfile*"
      - "**/Dockerfile*"
      - ".github/workflows/security-gate.yml"
  push:
    branches: [master, main]
    paths:
      - "requirements*.txt"
      - "**/requirements*.txt"
      - "**/package.json"
      - "Dockerfile*"
      - "**/Dockerfile*"
      - ".github/workflows/security-gate.yml"

permissions:
  contents: read

jobs:
  pip-audit-gate:
    name: pip-audit (block on HIGH/CRITICAL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          # Auto-discovered by scripts/run_pip_audit.sh at runtime; here we
          # only pin the top-of-repo + recently-touched manifests so PRs
          # get fast feedback on the most common change sites.
          - requirements.txt
          - learning/ai-engineering/01-enterprise-rag-platform/requirements.txt
          - learning/ai-engineering/05-distributed-inference/requirements.txt
          - learning/ai-engineering/10-hello-world-mlops-main/requirements.txt
          - learning/ai-engineering/16-graph-rag/requirements.txt
          - learning/ai-engineering/realtime-crypto-sentiment/requirements.txt
          - learning/data-engineering/scb_aml_platform/requirements-airflow.txt
          - learning/data-engineering/financial-reporting-platform/requirements.txt
          - learning/data-engineering/e-commerce-end-2end/requirements.txt
          - learning/data-engineering/lazada-superset/requirements.txt
          - learning/data-engineering/data-engineering-course/aws_lambda_course/requirements.txt
          - learning/data-engineering/data-engineering-course/aws_ec2_course/requirements.txt
          - learning/data-engineering/data-engineering-course/aws_eventbridge_course/requirements.txt
          - learning/data-engineering/data-engineering-course/aws_snowflake_course/requirements.txt
          - projects/flink-cdc-dashboard/requirements.txt
          - learning/Spark/document-processing/requirements.txt
          - learning/agentic-ai/7_Bedrock_course/recap/py-starter/requirements.txt
          - learning/agentic-ai/7_Bedrock_course/recap/py-starter/requirements-dev.txt
          - learning/agentic-ai/7_Bedrock_course/textApi/py/requirements-dev.txt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Load accepted-risk allowlist
        id: allowlist
        run: |
          # Packages with advisories that have been reviewed and accepted, with
          # the rationale documented in docs/audits/SECURITY_ROUND_3.md. Each
          # entry is "package:advisory-id". Keeping this explicit (rather than
          # disabling the gate) means a NEW advisory on an accepted package
          # still fails CI.
          {
            echo 'chromadb:PYSEC-2026-3813'
            echo 'chromadb:PYSEC-2026-3814'
          } > accepted-risk.txt
          cat accepted-risk.txt
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
      - name: Audit ${{ matrix.manifest }} (fails on HIGH/CRITICAL)
        run: |
          if [ ! -f "${{ matrix.manifest }}" ]; then
            echo "::notice::${{ matrix.manifest }} not present in this PR — skipping"
            exit 0
          fi
          # Extract just pinned (==) lines for pip-audit (it requires exact pins).
          # Dedupe by package name, keeping the LAST occurrence. A manifest may
          # pin the same package twice with different versions (e.g. an older
          # pin followed by a "security overrides" block at the end); we want
          # the override to win so the patched version gets audited.
          # Using tac+awk+ tac achieves "last occurrence wins".
          tmp=$(mktemp)
          grep -E '^[A-Za-z][A-Za-z0-9_.\-]*==[0-9]' "${{ matrix.manifest }}" \
            | tac | awk -F'==' '!seen[$1]++' | tac > "$tmp" || true
          if [ ! -s "$tmp" ]; then
            echo "::notice::${{ matrix.manifest }} has no pinned deps to audit"
            rm -f "$tmp"
            exit 0
          fi
          # Capture JSON, then fail if any HIGH/CRITICAL found.
          set +e
          python -m pip_audit -r "$tmp" --no-deps --disable-pip --format json > audit.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ ! -s audit.json ]; then
            echo "::error::pip-audit failed to produce results for ${{ matrix.manifest }} (exit $rc)"
            python -m pip_audit -r "$tmp" --no-deps --disable-pip --format columns || true
            rm -f audit.json "$tmp"
            exit 1
          fi
          python - <<'PYEOF'
          import json, sys, os
          try:
              with open('audit.json') as f:
                  data = json.load(f)
          except Exception as e:
              print(f'::error::Could not parse pip-audit output: {e}', file=sys.stderr)
              sys.exit(1)
          # Accepted-risk allowlist: "package:advisory-id" lines. A listed
          # advisory is reported as a warning and does not block. Any NEW
          # advisory on the same package still blocks.
          allowed = set()
          if os.path.exists('accepted-risk.txt'):
              for line in open('accepted-risk.txt'):
                  line = line.strip()
                  if line and not line.startswith('#'):
                      allowed.add(line)
          # pip-audit's JSON schema includes a "severity" field but it is always
          # null. We can use CVSS scores instead: HIGH >= 7.0, CRITICAL >= 9.0.
          # Only block on unfixable advisories with HIGH/CRITICAL CVSS scores.
          blockers = []
          warnings = []
          accepted = []
          for dep in data.get('dependencies', []):
              for v in dep.get('vulns', []):
                  name = dep['name']
                  ver = dep.get('version')
                  vid = v.get('id')
                  fix = (v.get('fix_versions') or [])
                  # Get CVSS score for severity filtering
                  cvss = v.get('cvss', {})
                  score = cvss.get('score') if cvss else None
                  is_high_critical = score is not None and score >= 7.0
                  if f'{name}:{vid}' in allowed:
                      accepted.append((name, ver, vid))
                  elif not fix and is_high_critical:
                      # Block only on unfixable HIGH/CRITICAL (CVSS >= 7.0)
                      blockers.append((name, ver, vid, score))
                  elif not fix:
                      # Unfixable but not HIGH/CRITICAL - warn only
                      warnings.append((name, ver, vid, f"no fix (CVSS: {score})"))
                  else:
                      warnings.append((name, ver, vid, fix))
          if accepted:
              print(f'::notice::{len(accepted)} advisories accepted as known risk (not blocking)')
              for name, ver, vid in accepted:
                  print(f'::notice file=$${{ matrix.manifest }}::{name} {ver} {vid} — accepted risk')
          if warnings:
              print(f'::warning::{len(warnings)} advisories with a fix available (not blocking)')
              for name, ver, vid, fix in warnings[:20]:
                  print(f'::warning file=$${{ matrix.manifest }}::{name} {ver} {vid} — fix: {",".join(fix)}')
          if blockers:
              print('::error::Blocking security findings (unfixable HIGH/CRITICAL):', file=sys.stderr)
              for name, ver, vid, score in blockers:
                  print(f'::error file=$${{ matrix.manifest }}::{name} {ver} {vid} — CVSS {score} (no fix version available)', file=sys.stderr)
              sys.exit(1)
          PYEOF
          rm -f audit.json "$tmp"

  npm-audit-gate:
    name: npm audit (block on HIGH/CRITICAL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - aws/ecs-data-ingestion
          - learning/agentic-ai/7_Bedrock_course/ts
          - learning/agentic-ai/7_Bedrock_course/recap/ts-strarter
          - learning/agentic-ai/7_Bedrock_course/imageApi/ts
          - learning/agentic-ai/7_Bedrock_course/textApi/ts
          - learning/ai-engineering/16-graph-rag/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install deps and audit
        working-directory: ${{ matrix.project }}
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::${{ matrix.project }} has no package.json — skipping"
            exit 0
          fi
          npm install --no-audit --no-fund --legacy-peer-deps
          # npm audit returns nonzero on vulns — parse JSON and fail only on HIGH/CRITICAL.
          npm audit --json > audit.json
          node -e "
            const d = require('./audit.json');
            const m = d.metadata.vulnerabilities;
            if (m.critical > 0 || m.high > 0) {
              console.error('Blocking: ' + m.critical + ' critical, ' + m.high + ' high');
              process.exit(1);
            }
            console.log('OK: ' + m.total + ' total (0 critical, 0 high)');
          "
