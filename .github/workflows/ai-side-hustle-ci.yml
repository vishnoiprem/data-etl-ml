name: ai-side-hustle-ci

# CI for the learning/ai-engineering/40-ai-side-hustle project.
# - Pure-Python, no external services. Just runs pytest on every push.
# - The 4 streams + projections + simulator + dashboard + merch
#   total 65 tests; all should pass in <2s.

on:
  push:
    # `master` is this repo's default branch; `main` is kept for
    # compatibility but is stale.
    branches: [master, main]
    paths:
      - "learning/ai-engineering/40-ai-side-hustle/**"
      - ".github/workflows/ai-side-hustle-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "learning/ai-engineering/40-ai-side-hustle/**"

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ai-side-hustle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: learning/ai-engineering/40-ai-side-hustle/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r learning/ai-engineering/40-ai-side-hustle/requirements.txt

      - name: Run tests
        run: |
          cd learning/ai-engineering/40-ai-side-hustle
          python -m pytest tests/ -v

      - name: Smoke test (make demo in --no-record mode)
        # Confirms the orchestrator at least imports + runs end-to-end
        # without writing to the ledger. Catches import/typo regressions.
        run: |
          cd learning/ai-engineering/40-ai-side-hustle
          python scripts/run_factory.py --no-record --output /tmp/side-hustle-smoke
          test -f /tmp/side-hustle-smoke/INDEX.md && echo "INDEX.md OK"
          # Clean up the smoke-test output so the runner stays tidy.
          rm -rf /tmp/side-hustle-smoke
