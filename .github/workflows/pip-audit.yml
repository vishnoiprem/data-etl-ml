name: pip-audit

# Weekly scan + on every push that touches a requirements file.
# Failure threshold: HIGH/CRITICAL vulns block CI.
# See docs/SECURITY_AUDIT.md for current findings and Tier 1/2/3 fix plan.

on:
  push:
    paths:
      - "requirements*.txt"
      - "**/requirements*.txt"
      - ".github/workflows/pip-audit.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - "**/requirements*.txt"
      - ".github/workflows/pip-audit.yml"
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF

jobs:
  audit-root:
    name: Audit root requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: pip-audit (root)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --version
          # Audit direct deps only (avoids torch/CUDA resolution failures on CI).
          # Dedupe by package name (LAST occurrence wins) — security overrides
          # at the end of the file should take precedence. Use tac to reverse,
          # dedupe, then reverse back.
          mkdir -p .audit
          grep -E '^[A-Za-z][A-Za-z0-9_.\-]*==[0-9]' requirements.txt \
            | tac | awk -F'==' '!seen[$1]++' | tac > .audit/root-pinned.txt || true
          python -m pip_audit -r .audit/root-pinned.txt --no-deps --disable-pip --format json \
              --output .audit/root.json || true
          python -m pip_audit -r .audit/root-pinned.txt --no-deps --disable-pip --format columns || true

  audit-projects:
    name: Audit per-project manifests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - learning/data-engineering/scb_aml_platform/requirements.txt
          - learning/data-engineering/scb_aml_platform/requirements-airflow.txt
          - learning/ai-engineering/01-enterprise-rag-platform/requirements.txt
          - learning/ai-engineering/03-multi-agent-platform/requirements.txt
          - learning/ai-engineering/05-distributed-inference/requirements.txt
          - learning/ai-engineering/16-graph-rag/requirements.txt
          - learning/ai-engineering/16-graph-rag/requirements-dev.txt
          - projects/leads-pipeline/draft-cron/requirements.txt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: pip-audit (${{ matrix.manifest }})
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          if [ -f "${{ matrix.manifest }}" ]; then
            mkdir -p .audit
            base=$(echo "${{ matrix.manifest }}" | tr '/' '_')
            grep -E '^[A-Za-z][A-Za-z0-9_.\-]*==[0-9]' "${{ matrix.manifest }}" \
              | tac | awk -F'==' '!seen[$1]++' | tac > ".audit/${base}-pinned.txt" || true
            if [ -s ".audit/${base}-pinned.txt" ]; then
              python -m pip_audit -r ".audit/${base}-pinned.txt" \
                  --no-deps --disable-pip --format columns || true
            else
              echo "::notice::${{ matrix.manifest }} has no pinned deps to audit"
            fi
          else
            echo "::notice::${{ matrix.manifest }} not found — skipping"
          fi

  upload-sarif:
    name: Upload SARIF (best effort)
    runs-on: ubuntu-latest
    needs: [audit-root, audit-projects]
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build SARIF
        run: |
          python -m pip install --quiet pip-audit==2.10.1
          mkdir -p .audit
          grep -E '^[A-Za-z][A-Za-z0-9_.\-]*==[0-9]' requirements.txt \
            | tac | awk -F'==' '!seen[$1]++' | tac > .audit/sarif-pinned.txt || true
          # Only generate SARIF if we have pinned deps and pip-audit succeeds
          if [ -s .audit/sarif-pinned.txt ]; then
            python -m pip_audit -r .audit/sarif-pinned.txt --no-deps --disable-pip \
                --format sarif --output .audit/pip-audit.sarif
          else
            echo "::notice::No pinned deps to audit for SARIF"
            rm -f .audit/sarif-pinned.txt
          fi
      - name: Upload to code-scanning
        if: hashFiles('.audit/pip-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .audit/pip-audit.sarif
          category: pip-audit
        continue-on-error: true