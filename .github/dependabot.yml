# Dependabot configuration
# - Weekly scans on Monday 09:00 IST
# - Auto-PRs for security updates (patch + minor)
# - Limits open PRs to 10 to avoid noise
# - Grouped PRs by ecosystem + scope to keep reviews manageable

version: 2

# --- Python: pip ecosystem ---
updates:
  # Root + ai-engineering manifests (active project work)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "jinja2"
          - "cryptography"
          - "urllib3"
          - "requests"
          - "pillow"
          - "fastapi"
          - "starlette"
          - "aiohttp"
          - "pyjwt"
          - "setuptools"
          - "pypdf"
          - "tornado"
          - "transformers"
          - "protobuf"
          - "nltk"
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/ai-engineering"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "python"
      - "ai-engineering"
    commit-message:
      prefix: "chore(ai-eng)"
      include: "scope"
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "jinja2"
          - "cryptography"
          - "urllib3"
          - "requests"
          - "pillow"
          - "fastapi"
          - "starlette"
          - "aiohttp"
          - "pyjwt"
          - "setuptools"
          - "pypdf"
          - "tornado"
          - "transformers"
          - "protobuf"
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns: ["*"]

  # data-engineering (NEW: previously unscanned)
