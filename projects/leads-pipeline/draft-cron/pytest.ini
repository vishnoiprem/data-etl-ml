[pytest]
# Tests write rows into Postgres (the dedup/bounce tests insert leads and
# let them accumulate). Point them at a dedicated test database so they
# never pollute the live avilx_leads database.
#
# The env var is set at import time, before any test module is collected,
# so db/lead_store._conn_params() picks it up. CI does the same via
# AVILX_DB_NAME: avilx_test.
#
# Run `make test-db` once to create the database and apply the schema.
env =
    AVILX_DB_NAME=avilx_test

testpaths = tests
python_files = test_*.py
