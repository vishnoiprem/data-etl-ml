# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'feature-store-dev'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Feature API Server
  - job_name: 'feature-api'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - feature-store
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: feature-api
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace

  # Model Server
  - job_name: 'model-server'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - feature-store
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: model-server
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  # Flink JobManager
  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['flink-jobmanager:8081']

  # Flink TaskManagers
  - job_name: 'flink-taskmanager'
    static_configs:
      - targets: ['flink-taskmanager:9251']

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  # Redis Cluster
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-node-0:7000', 'redis-node-1:7001', 'redis-node-2:7002']

  # Cassandra
  - job_name: 'cassandra'
    static_configs:
      - targets: ['cassandra:9042']

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432', 'registry-db:5432']

  # MinIO
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']

  # Trino
  - job_name: 'trino'
    static_configs:
      - targets: ['trino:8080']

  # Node Exporter (if running)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Blackbox (endpoint probing)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://feature-api:8082/health
        - http://model-server:8085/health
        - http://grafana:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115