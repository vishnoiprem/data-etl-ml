[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The tests import pytest for fixtures and raises; not every module uses both.
"tests/*" = ["B011"]

# pytest configuration lives in pytest.ini. It is the higher-precedence file
# for this project, so it is not duplicated here — a second copy would only
# risk the two drifting apart.
