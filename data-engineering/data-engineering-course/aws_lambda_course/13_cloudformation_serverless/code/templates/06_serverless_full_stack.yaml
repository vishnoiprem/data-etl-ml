AWSTemplateFormatVersion: "2010-09-09"
Description: >
  L68 full-stack template — API Gateway + Lambda + S3 CRUD app in
  one CloudFormation stack. Lambda code is uploaded by
  `aws cloudformation package`. Deploy with:
    aws cloudformation package \
      --template-file templates/06_serverless_full_stack.yaml \
      --s3-bucket <cfn-assets-bucket> \
      --output-template-file /tmp/06.pkg.yaml
    aws cloudformation deploy \
      --stack-name serverless-full-stack \
      --template-file /tmp/06.pkg.yaml \
      --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM

Parameters:
  BucketName:
    Type: String
    Description: S3 bucket the Lambda reads/writes.
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage.

Resources:
  ServerlessBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: serverless-full-stack-lambda-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  LambdaS3Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: serverless-full-stack-s3-policy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !Sub "arn:aws:s3:::${BucketName}"
              - !Sub "arn:aws:s3:::${BucketName}/*"
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "*"

  GetObjectFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: serverless-get-object
      Runtime: python3.11
      Handler: get_object.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref ServerlessBucket
      Code:
        S3Bucket: !Ref CodeAssetsBucket
        S3Key: lambdas/get_object.zip

  PutObjectFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: serverless-put-object
      Runtime: python3.11
      Handler: put_object.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref ServerlessBucket
      Code:
        S3Bucket: !Ref CodeAssetsBucket
        S3Key: lambdas/put_object.zip

  CodeAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "serverless-cfn-assets-${AWS::AccountId}-${AWS::Region}"

  ServerlessApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: serverless-full-stack-api
      EndpointConfiguration:
        Types:
          - REGIONAL

  ObjectsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ServerlessApi
      ParentId: !GetAtt ServerlessApi.RootResourceId
      PathPart: objects

  ObjectKeyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ServerlessApi
      ParentId: !Ref ObjectsResource
      PathPart: "{proxy+}"

  GetObjectMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ServerlessApi
      ResourceId: !Ref ObjectKeyResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetObjectFunction.Arn}/invocations"

  PutObjectMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ServerlessApi
      ResourceId: !Ref ObjectKeyResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PutObjectFunction.Arn}/invocations"

  GetInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetObjectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ServerlessApi}/*/GET/objects/*"

  PutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PutObjectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ServerlessApi}/*/PUT/objects/*"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetObjectMethod
      - PutObjectMethod
    Properties:
      RestApiId: !Ref ServerlessApi
      Description: Full-stack initial deployment.

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ServerlessApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref StageName

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
    Description: Invoke URL for the API.
  BucketName:
    Value: !Ref ServerlessBucket
    Description: S3 bucket the Lambda reads/writes.
  GetObjectFunctionName:
    Value: !Ref GetObjectFunction
    Description: Name of the GET Lambda.
  PutObjectFunctionName:
    Value: !Ref PutObjectFunction
    Description: Name of the PUT Lambda.
