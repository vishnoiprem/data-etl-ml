# ============================================================================
# packages.yml — dbt packages installed via `dbt deps`.
# ----------------------------------------------------------------------------
# Author: Prem Vishnoi <pvishnoi@avilx.com>
#
# Installed with `dbt deps` (writes to dbt_packages/). These packages are
# referenced throughout the course: codegen (auto-staging models),
# dbt_utils (date_spine, pivot, etc.), audit_helper (compare 2 relations).
# ============================================================================

packages:
  - package: dbt-labs/codegen
    version: [">=0.13.0", "<0.15.0"]

  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]

  - package: dbt-labs/audit_helper
    version: [">=0.13.0", "<0.15.0"]
