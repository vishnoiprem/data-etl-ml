# Prometheus scrape config + alert rules for the MLOps fine-tune stack.
#
# Two scrape targets:
#   1. `vllm` — exposes /metrics from our FastAPI wrapper (port 9090 inside
#      the container, mapped to host 9090).
#   2. `prometheus` — self-scrape so we can alert on Prometheus itself.
#
# Alert rules (alerts.yml):
#   - HighErrorRate     — error_count / total > 5% over 5m
#   - HighLatency       — p95 latency > 1.2s over 10m
#   - ModelDriftHigh    — model_drift_score > 0.3 over 5m
#   - VllmDown          — vllm up{job="vllm"} == 0 for 2m

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "mlops-finetune-genai"

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "vllm"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["vllm:9090"]
        labels:
          service: "vllm"
          job: "vllm"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          job: "prometheus"
