[project]
name = "databricks-agent-app"
version = "0.1.0"
description = "Production-oriented Databricks App agent with MLflow tracing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "databricks-sdk>=0.60",
  "openai>=1.60",
  "mlflow[genai]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
start-server = "src.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
