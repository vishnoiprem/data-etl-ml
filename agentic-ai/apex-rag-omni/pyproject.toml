[tool.pytest.ini_options]
# Async test mode. With "auto", every `async def` test is automatically
# treated as an asyncio test. Required for tests/test_api.py.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Be quiet about unrelated warnings.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
