<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>trading-bot dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --blue: #58a6ff;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .nav { display: flex; gap: 16px; }
  .nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .nav a.active { color: var(--text); background: var(--border); }
  .clock { color: var(--muted); font-family: monospace; }
  .clock .open { color: var(--green); }
  .clock .closed { color: var(--red); }
  main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  section h2 {
    margin: 0 0 12px 0;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  th, td {
    text-align: right;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .ticker { font-weight: 600; }
  .name { color: var(--muted); font-size: 12px; }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .neutral { color: var(--muted); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .badge.buy, .badge.up { background: rgba(63, 185, 80, 0.15); color: var(--green); }
  .badge.hold, .badge.neutral { background: rgba(210, 153, 34, 0.15); color: var(--yellow); }
  .badge.wait, .badge.down { background: rgba(248, 81, 73, 0.15); color: var(--red); }
  .badge.avoid { background: rgba(248, 81, 73, 0.25); color: var(--red); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }
  .stat .label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat .value {
    font-size: 18px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat .sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }
  .spark { width: 80px; height: 24px; vertical-align: middle; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
  .refresh-indicator {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .footer {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 20px;
  }

  /* === Analysis cards === */
  .analysis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 16px;
  }
  .analysis-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .analysis-card .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .analysis-card .ticker-info .tk { font-size: 22px; font-weight: 700; }
  .analysis-card .ticker-info .nm { color: var(--muted); font-size: 12px; }
  .analysis-card .ticker-info .px { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .analysis-card .ticker-info .ch { font-size: 13px; }
  .analysis-card .verdict {
    text-align: right;
  }
  .analysis-card .verdict .vbadge {
    font-size: 14px;
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .analysis-card .verdict .sc {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .reasons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 12px 0;
  }
  .reasons .col h4 {
    margin: 0 0 6px 0;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .reasons ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .reasons li {
    padding: 4px 0;
    font-size: 12.5px;
    line-height: 1.4;
  }
  .reasons li.bull::before { content: "+ "; color: var(--green); font-weight: 700; }
  .reasons li.bear::before { content: "− "; color: var(--red); font-weight: 700; }
  .reasons li.empty { color: var(--muted); font-style: italic; font-size: 12px; }
  .levels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  .levels .lbl { color: var(--muted); text-transform: uppercase; font-size: 10px; }
  .levels .val { font-variant-numeric: tabular-nums; font-weight: 500; }
  .levels .group { padding: 6px 8px; background: var(--panel); border-radius: 4px; }
  .levels .group.support .val { color: var(--green); }
  .levels .group.resist .val { color: var(--red); }
  .meta-row {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    font-size: 11px;
    color: var(--muted);
  }
  .meta-row span strong { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>📊 trading-bot dashboard</h1>
  <div class="nav">
    <a href="#" data-view="analysis" class="active">analysis</a>
    <a href="#" data-view="watchlist">watchlist</a>
    <a href="#" data-view="positions">positions</a>
    <a href="#" data-view="market">market</a>
  </div>
  <div class="clock">
    <span class="refresh-indicator"></span>
    <span id="clock">loading…</span>
  </div>
</header>
<main>

  <!-- ANALYSIS VIEW (default) -->
  <div id="view-analysis">
    <section>
      <h2>analysis · why buy · why wait · verdict</h2>
      <div class="analysis-grid" id="analysis-grid">
        <div class="empty">loading…</div>
      </div>
    </section>
  </div>

  <!-- WATCHLIST VIEW -->
  <div id="view-watchlist" style="display:none">
    <section>
      <h2>watchlist</h2>
      <table>
        <thead>
          <tr>
            <th>ticker</th>
            <th>price</th>
            <th>day</th>
            <th>trend</th>
            <th>RSI</th>
            <th>MACD</th>
            <th>BB</th>
            <th>vol</th>
            <th>5d</th>
          </tr>
        </thead>
        <tbody id="watchlist-body">
          <tr><td colspan="9" class="empty">loading…</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <!-- POSITIONS VIEW -->
  <div id="view-positions" style="display:none">
    <section>
      <h2>open positions</h2>
      <div id="positions-body">
        <div class="empty">loading…</div>
      </div>
    </section>
  </div>

  <!-- MARKET VIEW -->
  <div id="view-market" style="display:none">
    <section>
      <h2>market snapshot</h2>
      <div class="grid" id="market-grid"></div>
    </section>
    <section>
      <h2>market context</h2>
      <div class="grid" id="sector-grid"></div>
    </section>
  </div>

</main>
<div class="footer">
  auto-refresh every 30s · last updated <span id="last-update">—</span>
</div>

<script>
// ---- helpers ----------------------------------------------------------------
const $ = id => document.getElementById(id);
const fmt = (x, dp = 2) => x == null ? "—" : Number(x).toLocaleString(
  undefined, { minimumFractionDigits: dp, maximumFractionDigits: dp });
const fmtMoney = x => x == null ? "—" : "$" + fmt(x);
const sign = x => x >= 0 ? "+" : "";
const cls = (x) => x > 0 ? "up" : x < 0 ? "down" : "neutral";

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function sparklineSVG(values, width = 80, height = 24) {
  if (!values || values.length < 2) return "";
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const dx = width / (values.length - 1);
  const points = values.map((v, i) => {
    const x = i * dx;
    const y = height - ((v - min) / range) * height;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const color = values[values.length - 1] >= values[0] ? "var(--green)" : "var(--red)";
  return `<svg class="spark" viewBox="0 0 ${width} ${height}">
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5"/>
  </svg>`;
}

// ---- view switching ---------------------------------------------------------
function showView(name) {
  for (const v of ["analysis", "watchlist", "positions", "market"]) {
    $(`view-${v}`).style.display = v === name ? "block" : "none";
  }
  document.querySelectorAll(".nav a").forEach(a => {
    a.classList.toggle("active", a.dataset.view === name);
  });
}
document.querySelectorAll(".nav a").forEach(a => {
  a.addEventListener("click", e => {
    e.preventDefault();
    showView(a.dataset.view);
  });
});

// ---- renderers --------------------------------------------------------------
function renderMarketHeader(snap) {
  const c = snap.clock;
  const statusClass = c.status === "open" ? "open" : "closed";
  $("clock").innerHTML =
    `${c.now_et} · <span class="${statusClass}">${c.status.replace("_", " ")}</span> · ${c.label}`;
}

function renderAnalysis(analysis) {
  const cards = analysis.tickers.map(t => {
    if (t.verdict === "NO_DATA") {
      return `<div class="analysis-card"><div class="empty">${t.ticker}: no data</div></div>`;
    }
    const v = t.verdict.toLowerCase();
    const chgClass = t.change_pct >= 0 ? "up" : "down";
    const bull = t.bull.length
      ? t.bull.map(x => `<li class="bull">${x}</li>`).join("")
      : `<li class="empty">no bull signals</li>`;
    const bear = t.bear.length
      ? t.bear.map(x => `<li class="bear">${x}</li>`).join("")
      : `<li class="empty">no bear signals — clean setup</li>`;
    const L = t.levels;
    return `<div class="analysis-card">
      <div class="header">
        <div class="ticker-info">
          <div class="tk">${t.ticker}</div>
          <div class="nm">${t.name || ""}</div>
          <div class="px">${fmtMoney(t.price)}</div>
          <div class="ch ${chgClass}">${sign(t.change_pct)}${fmt(t.change_pct)}% today</div>
        </div>
        <div class="verdict">
          <div class="vbadge badge ${v}">${t.verdict}</div>
          <div class="sc">bull ${t.score[0]} · bear ${t.score[1]}</div>
        </div>
      </div>
      <div class="reasons">
        <div class="col">
          <h4>why buy</h4>
          <ul>${bull}</ul>
        </div>
        <div class="col">
          <h4>why wait</h4>
          <ul>${bear}</ul>
        </div>
      </div>
      <div class="levels">
        <div class="group support">
          <div class="lbl">entry</div>
          <div class="val">$${fmt(L.entry_now)} now</div>
          <div class="val">$${fmt(L.entry_pullback)} on pullback</div>
        </div>
        <div class="group support">
          <div class="lbl">support</div>
          <div class="val">$${fmt(L.support_1)} MA50</div>
          <div class="val">$${fmt(L.support_2)} MA200</div>
        </div>
        <div class="group resist">
          <div class="lbl">resistance</div>
          <div class="val">$${fmt(L.resist_1)} 60d hi</div>
          <div class="val">$${fmt(L.resist_2)} 52w hi</div>
        </div>
        <div class="group resist">
          <div class="lbl">stop</div>
          <div class="val">$${fmt(L.stop)} (-7%)</div>
        </div>
      </div>
      <div class="meta-row">
        <span>RSI <strong>${fmt(t.rsi, 0)}</strong></span>
        <span>MACD <strong>${t.macd_state}</strong></span>
        <span>BB% <strong>${fmt(t.bb_pct * 100, 0)}</strong></span>
        <span>trend <strong>${t.trend}</strong></span>
        <span>vol <strong>${fmt(t.vol_annual, 0)}%</strong></span>
        <span>5d <strong class="${t.slope_5d >= 0 ? "up" : "down"}">${sign(t.slope_5d)}${fmt(t.slope_5d)}%</strong></span>
      </div>
    </div>`;
  }).join("");
  $("analysis-grid").innerHTML = cards || `<div class="empty">no data</div>`;
}

function renderWatchlist(snap) {
  const rows = snap.watchlist.map(t => {
    if (t.error) {
      return `<tr><td colspan="9" class="empty">${t.ticker}: ${t.error}</td></tr>`;
    }
    const rsi = t.rsi14 != null ? fmt(t.rsi14, 0) : "—";
    const rsiClass = t.rsi14 > 70 ? "up" : t.rsi14 < 30 ? "down" : "neutral";
    const trendClass = t.trend === "uptrend" ? "up" : t.trend === "downtrend" ? "down" : "neutral";
    const macd = t.macd_state || "—";
    const bbPos = t.bb_pos || "—";
    const bbColor = bbPos === "upper" ? "up" : bbPos === "lower" ? "down" : "neutral";
    return `<tr>
      <td>
        <div class="ticker">${t.ticker}</div>
        <div class="name">${t.name || ""}</div>
      </td>
      <td><b>${fmtMoney(t.price)}</b></td>
      <td class="${cls(t.change)}">
        ${sign(t.change)}${fmt(t.change)}<br>
        <span style="font-size:11px">${sign(t.change_pct)}${fmt(t.change_pct)}%</span>
      </td>
      <td><span class="badge ${trendClass}">${t.trend}</span></td>
      <td class="${rsiClass}"><b>${rsi}</b></td>
      <td>${macd}</td>
      <td class="${bbColor}">${bbPos}</td>
      <td>${fmt(t.vol_annual, 0)}%</td>
      <td>${sparklineSVG(t.spark)}</td>
    </tr>`;
  }).join("");
  $("watchlist-body").innerHTML = rows || `<tr><td colspan="9" class="empty">no data</td></tr>`;
}

function renderPositions(snap) {
  const p = snap.positions;
  if (!p.db_connected) {
    $("positions-body").innerHTML =
      '<div class="empty">no state.db found at the configured path — start the bot to see positions here</div>';
    return;
  }
  if (p.positions.length === 0) {
    $("positions-body").innerHTML = '<div class="empty">no open positions</div>';
    return;
  }
  const total = p.positions.reduce((s, x) => s + x.market_value, 0);
  const rows = p.positions.map(x => {
    const pnlClass = x.pnl >= 0 ? "up" : "down";
    return `<tr>
      <td class="ticker">${x.ticker}</td>
      <td>${x.shares}</td>
      <td>${fmtMoney(x.avg_cost)}</td>
      <td>${fmtMoney(x.current_price)}</td>
      <td>${fmtMoney(x.market_value)}</td>
      <td>${fmtMoney(x.cost_basis)}</td>
      <td class="${pnlClass}"><b>${sign(x.pnl)}${fmtMoney(x.pnl)}</b></td>
      <td class="${pnlClass}">${sign(x.pnl_pct)}${fmt(x.pnl_pct)}%</td>
    </tr>`;
  }).join("");
  $("positions-body").innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ticker</th><th>shares</th><th>avg cost</th>
          <th>price</th><th>value</th><th>basis</th>
          <th>P&L</th><th>%</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr>
          <td colspan="4"><b>total</b></td>
          <td><b>${fmtMoney(total)}</b></td>
          <td colspan="3"></td>
        </tr>
      </tfoot>
    </table>
  `;
}

function renderMarket(snap) {
  const f = snap.fear;
  const fearVal = f.price || 0;
  const fearState = fearVal > 30 ? "high" : fearVal > 20 ? "elevated" : fearVal > 12 ? "normal" : "low";
  const fearColor = fearVal > 30 ? "var(--red)" : fearVal > 20 ? "var(--yellow)" : "var(--green)";

  $("market-grid").innerHTML = `
    <div class="stat">
      <div class="label">VIX (fear)</div>
      <div class="value" style="color: ${fearColor}">${fmt(fearVal)}</div>
      <div class="sub">${fearState} · change ${sign(f.change)}${fmt(f.change_pct)}%</div>
    </div>
    <div class="stat">
      <div class="label">Cash (paper)</div>
      <div class="value">${fmtMoney(snap.positions.cash)}</div>
      <div class="sub">${snap.positions.positions.length} open position${snap.positions.positions.length === 1 ? "" : "s"}</div>
    </div>
    <div class="stat">
      <div class="label">Portfolio value</div>
      <div class="value">${fmtMoney(
        snap.positions.cash + snap.positions.positions.reduce((s, p) => s + p.market_value, 0)
      )}</div>
      <div class="sub">cash + position market value</div>
    </div>
    <div class="stat">
      <div class="label">Unrealized P&L</div>
      <div class="value" style="color: ${snap.positions.positions.reduce((s, p) => s + p.pnl, 0) >= 0 ? "var(--green)" : "var(--red)"}">
        ${sign(snap.positions.positions.reduce((s, p) => s + p.pnl, 0))}${fmtMoney(snap.positions.positions.reduce((s, p) => s + p.pnl, 0))}
      </div>
      <div class="sub">across all open positions</div>
    </div>
  `;
  const items = [...snap.sectors, snap.fear].filter(x => x && x.ticker);
  $("sector-grid").innerHTML = items.map(t => {
    const c = cls(t.change);
    return `<div class="stat">
      <div class="label">${t.ticker}</div>
      <div class="value">${fmtMoney(t.price)}</div>
      <div class="sub ${c}">${sign(t.change)}${fmt(t.change_pct)}%</div>
    </div>`;
  }).join("");
}

// ---- main loop --------------------------------------------------------------
async function refresh() {
  try {
    const [snap, analysis] = await Promise.all([
      fetchJSON("/api/snapshot"),
      fetchJSON("/api/analysis"),
    ]);
    renderMarketHeader(snap);
    renderAnalysis(analysis);
    renderWatchlist(snap);
    renderPositions(snap);
    renderMarket(snap);
    $("last-update").textContent = analysis.generated_at;
  } catch (e) {
    $("clock").textContent = "error: " + e.message;
  }
}

refresh();
setInterval(refresh, 30_000);
</script>
</body>
</html>
