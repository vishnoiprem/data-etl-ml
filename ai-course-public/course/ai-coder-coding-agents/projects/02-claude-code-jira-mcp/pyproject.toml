[project]
name = "ai-legal-doc-generator"
version = "0.1.0"
description = "Week 2 SaaS — built with Claude Code + Jira + GitHub MCP servers."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"