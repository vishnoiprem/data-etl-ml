<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing — AIForBiz</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <nav class="container">
      <a href="/" class="logo">AI<span>ForBiz</span></a>
      <div>
        <a href="/">Home</a>
        <a href="/prompts">Free Prompts</a>
        <a href="/admin">Admin</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <h1>Simple, honest pricing</h1>
    <p class="lede">One course. Lifetime access. All updates free. 14-day money-back guarantee.</p>

    <div class="pricing" id="pricing"></div>

    <div id="checkout-form" class="checkout hidden">
      <h2>Checkout: <span id="product-name"></span> — $<span id="product-price"></span></h2>
      <p>(This is a MOCK checkout. In production, this is where Stripe/PayPal would appear.)</p>
      <input type="email" id="checkout-email" placeholder="your@email.com" required>
      <button id="pay">Complete Purchase (MOCK)</button>
      <p id="checkout-msg"></p>
    </div>
  </main>

  <script>
    let selectedProduct = null;

    async function loadProducts() {
      const res = await fetch('/api/products');
      const products = await res.json();
      const html = Object.entries(products).map(([key, p]) => `
        <div class="price-card ${key === 'main' ? 'featured' : ''}">
          ${key === 'main' ? '<div class="badge">Most Popular</div>' : ''}
          <h3>${p.name}</h3>
          <div class="price">$${p.price}</div>
          <p>${p.description}</p>
          <button onclick="selectProduct('${key}')">Choose ${p.name}</button>
        </div>
      `).join('');
      document.getElementById('pricing').innerHTML = html;
    }

    function selectProduct(key) {
      selectedProduct = key;
      fetch('/api/products').then(r => r.json()).then(products => {
        const p = products[key];
        document.getElementById('product-name').textContent = p.name;
        document.getElementById('product-price').textContent = p.price;
        document.getElementById('checkout-form').classList.remove('hidden');
        document.getElementById('checkout-form').scrollIntoView({behavior: 'smooth'});
      });
    }

    document.getElementById('pay').addEventListener('click', async () => {
      const email = document.getElementById('checkout-email').value;
      if (!email) return;
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email,
          product: selectedProduct,
          payment_token: 'mock_' + Date.now()
        })
      });
      const data = await res.json();
      document.getElementById('checkout-msg').textContent = data.message;
      document.getElementById('checkout-msg').style.color = '#27AE60';
    });

    loadProducts();
  </script>
</body>
</html>
