    type: postgres
    access: proxy
    url: timescaledb:5432
    database: stocks
    user: stocks
    secureJsonData:
      password: stocks
    jsonData:
      maxOpenConns: 10
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
    isDefault: true
