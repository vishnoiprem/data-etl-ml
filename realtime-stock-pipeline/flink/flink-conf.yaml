# Flink configuration for the realtime stock pipeline.
# Mounted into /opt/flink/conf/flink-conf.yaml inside the JobManager container
# to override runtime settings. Note: this file replaces (does not merge with)
# the image's default flink-conf.yaml, so it includes the full set of properties.

jobmanager.rpc.address: flink-jobmanager
jobmanager.bind-host: 0.0.0.0
rest.address: 0.0.0.0
rest.bind-address: 0.0.0.0
rest.port: 8081

jobmanager.memory.process.size: 1600m
taskmanager.memory.process.size: 2048m
taskmanager.numberOfTaskSlots: 4
parallelism.default: 2

# Disable noisy Akka logging
akka.loglevel: WARNING
